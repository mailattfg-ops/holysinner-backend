# Supabase free projects pause after 7 days without activity. This pings the API every 6 days;
# /api/health runs `select 1`, so the database registers activity even when the shop is closed.
name: Keep Supabase awake

on:
  schedule:
    - cron: '30 3 */6 * *' # 09:00 IST on days 1,7,13,19,25,31 → gap is never more than 6 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }} # e.g. https://<backend>.vercel.app/api/health
        run: |
          if [ -z "$HEALTH_URL" ]; then echo "::warning::HEALTH_URL secret not set yet, skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 "$HEALTH_URL"
